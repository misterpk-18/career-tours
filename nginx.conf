# Reference copy of /etc/nginx/conf.d/career-tours.conf on the deployed instance.
# The `managed by Certbot` lines were generated by `certbot --nginx --redirect`
# (docs/deployment.md, Step 8) — certbot rewrites them on renewal, so edit the
# server on the instance and copy the result back here rather than the reverse.

server {
    server_name career-tours.duckdns.org 13.203.206.148;

    # Resume uploads up to 10MB
    client_max_body_size 10M;

    access_log /var/log/nginx/career_tours_access.log;
    error_log  /var/log/nginx/career_tours_error.log info;

    root /home/ec2-user/career-tours/frontend/dist;
    index index.html;

    # React Router owns client-side routes; fall back to the app shell so deep
    # links and refreshes do not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api|db-test)(/|$) {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy LLM operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/career-tours.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/career-tours.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name career-tours.duckdns.org 13.203.206.148;

    # Send everything on port 80 -- hostname, bare IP, or any other Host header --
    # to the canonical HTTPS origin. Certbot generated a 404 here for non-matching
    # hosts, which broke pre-TLS links that used the IP.
    return 301 https://career-tours.duckdns.org$request_uri;
}
